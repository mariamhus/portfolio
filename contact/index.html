<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Mariam Hussein</title>
    <meta name="description" content="Get in touch with Mariam Hussein, a front-end engineer in Cairo." />
    <meta name="author" content="Mariam Hussein" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact | Mariam Hussein" />
    <meta property="og:description" content="Send a message to Mariam Hussein, front-end engineer." />
    <meta property="og:url" content="%SITE_URL%/contact/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <link rel="canonical" href="%SITE_URL%/contact/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#05060f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var stored = null;
        var storedSeason = null;
        try {
          stored = localStorage.getItem("portfolio:theme");
          storedSeason = localStorage.getItem("portfolio:season");
        } catch (error) {}
        // Northern-hemisphere seasons. ?season=spring|summer|autumn|winter previews one, then the
        // season picked in the header, then today's season.
        var month = new Date().getMonth();
        var seasons = ["winter", "winter", "spring", "spring", "spring", "summer", "summer", "summer", "autumn", "autumn", "autumn", "winter"];
        var preview = new URLSearchParams(location.search).get("season");
        document.documentElement.dataset.season =
          seasons.indexOf(preview) >= 0 ? preview : seasons.indexOf(storedSeason) >= 0 ? storedSeason : seasons[month];
        // No saved choice: spring and summer (March to August) open in day mode, autumn and winter in night mode.
        var themePreview = new URLSearchParams(location.search).get("theme");
        var theme = themePreview === "light" || themePreview === "dark" ? themePreview : stored === "light" || stored === "dark" ? stored : month >= 2 && month <= 7 ? "light" : "dark";
        if (theme === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#eef6ff");
        }
        // Loading screen: once per visit, and never for visitors who ask for reduced motion.
        var seen = false;
        try {
          seen = sessionStorage.getItem("portfolio:loaded") === "1";
        } catch (error) {}
        if (!seen && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.dataset.loading = "";
      })();
    </script>
  </head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="loader-sky"></div>
      <div class="loader-inner">
        <p class="loader-name"><span style="--i: 0">M</span><span style="--i: 1">a</span><span style="--i: 2">r</span><span style="--i: 3">i</span><span style="--i: 4">a</span><span style="--i: 5">m</span><br /><span class="loader-accent"><span style="--i: 7">H</span><span style="--i: 8">u</span><span style="--i: 9">s</span><span style="--i: 10">s</span><span style="--i: 11">e</span><span style="--i: 12">i</span><span style="--i: 13">n</span></span></p>
        <div class="loader-bar"><span></span></div>
        <p class="loader-role">Front-End Engineer</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/contact.tsx"></script>
  </body>
</html>
